[package]
name = "liquidzorro"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
hyperliquid_rust_sdk = { path = "../hyperliquid-rust-sdk" }
alloy = { version = "1.0", default-features = false, features = ["signer-local"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
