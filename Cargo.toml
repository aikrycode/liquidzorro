[package]
name = "liquidzorro"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
hyperliquid_rust_sdk = { path = "../hyperliquid-rust-sdk" }
alloy = { version = "1.0", default-features = false, features = ["signer-local", "sol-types", "dyn-abi"] }
# Encoding and signing actions the SDK has no method for (src/l1.rs);
# the same crates the SDK itself uses.
rmp-serde = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread"] }

[dev-dependencies]
libloading = "0.8"
